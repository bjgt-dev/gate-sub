name: enrich-ip-quality

# 每 6 小时富集一次 VPN Gate 候选 IP 的质量数据（ipquery.io 免费 API）
# 结果写入 ip-quality.json 并提交；Worker 运行时从 raw 拉取，免重新部署。
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: run enrichment
        run: python3 enrich.py
      - name: commit ip-quality.json
        run: |
          git config user.name "gate-sub-bot"
          git config user.email "gate-sub-bot@users.noreply.github.com"
          git add ip-quality.json
          git diff --cached --quiet && echo "无变化" || (git commit -m "chore: update ip-quality $(date -u +%FT%TZ)" && git push)
